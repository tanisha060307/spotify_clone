
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify - Your Favourite Music Player</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li class="brand">
                <img src="logo.png" alt="Spotify Logo">
                Spotify
            </li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <div class="songList">
        <h1>Best of Anupam Roy</h1>
        <div class="songItemContainer">
        </div>
        
        </div>

        <div class="songBanner">
        </div>

    </div>

    <!-- Bottom Music Player -->
    <div class="bottom">

        <!-- Progress Bar -->
        <input type="range" name="range" id="myProgressBar"
            min="0" max="100" value="0">

        <!-- Music Player Icons -->
        <div class="icons">
            <i class="fas fa-3x fa-step-backward" id="previous"></i>
            <i class="far fa-3x fa-play-circle" id="masterPlay"></i>
             <i class="fas fa-3x fa-step-forward" id="next"></i>

        </div>
        <div class="songInfo">
            <img src="playing.gif" width="42px" alt="" id="gif">
            <span id="currentSongName"></span>
        </div>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
